[project]
name = "mesh2step"
version = "0.1.0"
description = "Faceted triangle-mesh to B-Rep STEP converter (OCCT-backed, no surface fitting)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "trimesh",
    "cadquery-ocp",
]

[project.scripts]
mesh2step = "mesh2step.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
