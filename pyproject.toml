[project]
name = "mesh2step"
version = "0.1.0"
description = "Faceted triangle-mesh to B-Rep STEP converter (OCCT-backed, no surface fitting)"
requires-python = ">=3.10"
# ponytail: classic table form, not the PEP 639 SPDX string — that needs
# setuptools>=77 and this host still ships 68, which fails --no-build-isolation.
license = {text = "MIT"}
dependencies = [
    "numpy",
    "trimesh",
    "cadquery-ocp",
]

[project.scripts]
mesh2step = "mesh2step.cli:main"

[project.optional-dependencies]
test = ["pytest"]
web = ["fastapi", "uvicorn[standard]", "python-multipart"]
repair = ["pymeshfix"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Lint gate for the v2 parity work. Pinned explicitly (not left to ruff's evolving
# defaults) so the loopspec baseline fingerprint stays comparable across ruff releases.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "TRY", "RUF"]
