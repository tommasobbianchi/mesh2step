# Memory policy for mesh2step.service.
#
# Replaces a transient `systemctl --user set-property --runtime MemoryHigh=623M`
# that lived in /run/user/1000/systemd/user.control/ — invisible in the unit file
# and in every `systemctl cat`, so it looked like the service had no limits.
#
# Why it was harmful, measured 2026-09-05 while chasing "MMX Gate X4 never yields
# a step": the conversion engine peaks at ~1.35 GB on a 64k-triangle model, against
# MemoryHigh=623 MB. memory.events reported `high 87822` and memory PSI sat at
# full avg10=43%, so the process spent half its life in reclaim and drew 3% CPU
# after 400 seconds. Small models finished because they stayed under the cap;
# large ones could never finish at all, at any timeout.
#
# MemoryHigh is a THROTTLE: exceeding it stalls and reclaims, it never kills. A
# MemoryHigh the process cannot live under is a permanent thrash. MemoryMax is a
# real ceiling, and with two concurrent conversions at ~1.4 GB each plus the
# server itself, 6G leaves room without letting a runaway take the host.
[Service]
MemoryHigh=infinity
MemoryMax=6G
